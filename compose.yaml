services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: research
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d research"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/research
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/research
      REDIS_URL: redis://redis:6379
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_USD_PER_MILLION_TOKENS: ${EMBEDDING_USD_PER_MILLION_TOKENS:-0.02}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_INPUT_USD_PER_MILLION_TOKENS: ${LLM_INPUT_USD_PER_MILLION_TOKENS:-0.15}
      LLM_OUTPUT_USD_PER_MILLION_TOKENS: ${LLM_OUTPUT_USD_PER_MILLION_TOKENS:-0.6}
      PORT: 3000
      LOG_LEVEL: info
      MAX_PROCESSING_ATTEMPTS: ${MAX_PROCESSING_ATTEMPTS:-3}
      MAX_PENDING_JOBS_PER_WORKSPACE: ${MAX_PENDING_JOBS_PER_WORKSPACE:-20}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-120}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-10}
      EMBEDDING_REQUESTS_PER_MINUTE: ${EMBEDDING_REQUESTS_PER_MINUTE:-60}
      ANSWER_REQUESTS_PER_MINUTE: ${ANSWER_REQUESTS_PER_MINUTE:-30}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    environment:
      API_BASE_URL: http://api:3000
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-http://localhost:3001}
      # Development-only default; set a random key outside local Compose.
      WEB_SESSION_KEY: ${WEB_SESSION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  publisher:
    build: .
    command: ["node", "dist/processing/publisher.js"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/research
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "dist/processing/worker.js"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/research
      REDIS_URL: redis://redis:6379
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_USD_PER_MILLION_TOKENS: ${EMBEDDING_USD_PER_MILLION_TOKENS:-0.02}
      PDF_EXTRACTION_TIMEOUT_MS: ${PDF_EXTRACTION_TIMEOUT_MS:-30000}
      LOG_LEVEL: info
      EMBEDDING_REQUESTS_PER_MINUTE: ${EMBEDDING_REQUESTS_PER_MINUTE:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
